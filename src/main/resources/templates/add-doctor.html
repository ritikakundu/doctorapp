<!DOCTYPE html>
<html>
<head>
    <title>MediCare - Add Doctor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f7f6; }
        .form-container { background: white; padding: 30px; border-radius: 8px; max-width: 400px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Add New Doctor</h2>

    <form action="/doctors/save" method="post">

        <div class="form-group">
            <label>Doctor Name:</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="text" name="email">
        </div>

        <div class="form-group">
            <label>Specialization:</label>
            <input type="text" name="specialization" required>
        </div>

        <div class="form-group">
            <label>Phone:</label>
            <input type="text" name="phone">
        </div>

        <div class="form-group">
            <label>Experience (Years):</label>
            <input type="number" name="experienceYears">
        </div>

        <div class="form-group">
            <label>Rating:</label>
            <input type="number" name="rating" step="0.1">
        </div>

        <button type="submit">Save Doctor</button>
    </form>

    <a href="/doctors" class="back-link">Back to List</a>
</div>

</body>
</html>
